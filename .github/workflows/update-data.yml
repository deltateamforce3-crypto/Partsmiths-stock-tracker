name: Update market data

# Schedule (US Eastern, weekdays):
#   10 AM - 3 PM  hourly price refresh   (mode: quotes)
#   4 PM          full daily update       (mode: full - sentiment, news, analysts, 3 new picks)
#
# GitHub cron runs in UTC, ignores daylight saving, and can delay or drop runs
# when it's busy (worst near the top of the hour). So the job fires every hour at
# :23 on weekdays and the "plan" step decides what to do from New York time:
#   - 10:00-15:59 ET -> quotes
#   - 16:00-20:59 ET -> full, unless today's full update already ran
#     (so a dropped 4 PM run is made up at 5, 6, 7 or 8 PM)
#   - otherwise      -> skip
# workflow_dispatch also lets an outside scheduler (e.g. cron-job.org) start it.

on:
  schedule:
    - cron: "23 * * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = pick from the time, quotes = prices only, full = everything incl. picks"
        type: choice
        options: [auto, quotes, full]
        default: full

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Decide mode from New York time
        id: plan
        run: |
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ] || [ "$mode" = "auto" ]; then
            h=$(TZ=America/New_York date +%-H)
            today=$(TZ=America/New_York date +%F)
            last=$(python3 -c "import json;print(json.load(open('data/market.json')).get('lastFull',''))" 2>/dev/null || true)
            echo "New York hour: $h, last full update: ${last:-never}"
            if [ "$h" -ge 10 ] && [ "$h" -le 15 ]; then mode=quotes
            elif [ "$h" -ge 16 ] && [ "$h" -le 20 ] && [ "$last" != "$today" ]; then mode=full
            else mode=skip; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.mode != 'skip'
        with:
          python-version: "3.12"

      - name: Run updater
        if: steps.plan.outputs.mode != 'skip'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python3 scripts/update_data.py --mode "${{ steps.plan.outputs.mode }}"

      - name: Commit data
        if: steps.plan.outputs.mode != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Market data (${{ steps.plan.outputs.mode }}) $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git pull --rebase --autostash
          git push
