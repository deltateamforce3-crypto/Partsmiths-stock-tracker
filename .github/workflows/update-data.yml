name: Update market data

# Schedule (US Eastern, weekdays):
#   10 AM - 5 PM  hourly price refresh   (mode: quotes, includes the 4 PM close)
#   3 PM          full daily update       (mode: full - sentiment, news, analysts, 3 new picks)
#   every day     daily investing stories (from 7 AM ET; weekdays also refresh them at the
#                 first quotes/full run of the day, weekends use mode: stories)
#   Tips & strategies rotate every 2 hours in the browser, so they need no run.
#
# GitHub cron runs in UTC, ignores daylight saving, and can delay or drop runs
# when it's busy (worst near the top of the hour). So the job fires every hour at
# :23 every day and the "plan" step decides what to do from New York time:
#   - weekdays 15:00-20:59 ET -> full, unless today's full update already ran
#     (so a dropped 3 PM run is made up at the next hour that works, up to 8 PM)
#   - weekdays 10:00-17:59 ET -> quotes (every hour)
#   - any day from 7:00 ET    -> stories, if today's stories haven't been fetched yet
#   - otherwise               -> skip
# workflow_dispatch also lets an outside scheduler (e.g. cron-job.org) start it.
#
# The data lives on its own branch, `data` (just data/market.json), so these hourly
# commits never touch `main`. Your own pushes to `main` therefore never need a pull
# first, and the page reads the newest data straight from the `data` branch.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = pick from the time, quotes = prices only, full = everything incl. picks, stories = daily stories only"
        type: choice
        options: [auto, quotes, full, stories]
        default: full

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Load the latest data from the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:data/market.json > data/market.json
            echo "Loaded data/market.json from the data branch"
          else
            echo "No data branch yet; starting from the copy on main"
          fi

      - name: Decide mode from New York time
        id: plan
        run: |
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ] || [ "$mode" = "auto" ]; then
            h=$(TZ=America/New_York date +%-H)
            dow=$(TZ=America/New_York date +%u)   # 1 = Monday ... 7 = Sunday
            today=$(TZ=America/New_York date +%F)
            last=$(python3 -c "import json;print(json.load(open('data/market.json')).get('lastFull',''))" 2>/dev/null || true)
            stories=$(python3 -c "import json;print(json.load(open('data/market.json')).get('lastStories',''))" 2>/dev/null || true)
            echo "New York hour: $h (day $dow), last full update: ${last:-never}, last stories: ${stories:-never}"
            if [ "$dow" -le 5 ] && [ "$h" -ge 15 ] && [ "$h" -le 20 ] && [ "$last" != "$today" ]; then mode=full
            elif [ "$dow" -le 5 ] && [ "$h" -ge 10 ] && [ "$h" -le 17 ]; then mode=quotes
            elif [ "$h" -ge 7 ] && [ "$stories" != "$today" ]; then mode=stories
            else mode=skip; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.mode != 'skip'
        with:
          python-version: "3.12"

      - name: Run updater
        if: steps.plan.outputs.mode != 'skip'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python3 scripts/update_data.py --mode "${{ steps.plan.outputs.mode }}"

      - name: Save data to the data branch
        if: steps.plan.outputs.mode != 'skip'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/data" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/data" HEAD
            git -C "$RUNNER_TEMP/data" checkout --orphan data-new
            git -C "$RUNNER_TEMP/data" rm -rfq .
          fi
          mkdir -p "$RUNNER_TEMP/data/data"
          cp data/market.json "$RUNNER_TEMP/data/data/market.json"
          cd "$RUNNER_TEMP/data"
          git add data/market.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "Market data (${{ steps.plan.outputs.mode }}) $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          git push origin HEAD:refs/heads/data
